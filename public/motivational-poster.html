<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motivation Meme Project</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap");
      .libre-baskerville-regular {
        font-family: "Libre Baskerville", serif;
        font-weight: 400;
        font-style: normal;
      }

      .libre-baskerville-bold {
        font-family: "Libre Baskerville", serif;
        font-weight: 700;
        font-style: normal;
      }

      .libre-baskerville-regular-italic {
        font-family: "Libre Baskerville", serif;
        font-weight: 400;
        font-style: italic;
      }

      body {
        font-family: "Libre Baskerville", serif;
        background-color: rgb(255, 255, 255);
        color: white;
        text-align: center;
        align-items: center;
        min-height: 100vh;
      }

      img {
        border: double 1vw rgba(255, 220, 172, 0.696);
        width: 100%;
        height: auto;
        margin: 0 auto;
        display: block;
        box-sizing: border-box;
      }

      #structure {
        padding-bottom: 0;
      }

      #poster {
        background-color: black;
        border-radius: 8px;
        margin: 5vw auto;
        padding: 2vw;
        max-width: 600px;
        width: 90%;
        box-sizing: border-box;
        padding: clamp(1.5rem, 5vw, 3rem) clamp(1rem, 4vw, 2.5rem);
      }

      h1 {
        font-size: clamp(1.5rem, 10vw, 2.5rem);
        text-transform: uppercase;
        margin-bottom: 0.5em;
      }

      p {
        font-size: clamp(1rem, 1.8vw, 1rem);
        text-align: center;
      }

      hr {
        margin-top: -4px;
        margin-bottom: -5px;
        width: 450px;
        border-color: rgba(243, 214, 175, 0.786);
      }

      @media (max-width: 600px) {
        #poster {
          padding: 4vw;
        }

        h1 {
          font-size: clamp(1.1rem, 4vw, 1.8rem);
        }

        p {
          font-size: clamp(0.5rem, 2.7vw, 1.2rem);
        }

        hr {
          width: 80%;
        }
      }
    </style>
  </head>
  <body>
    <div id="poster">
      <div id="structure">
        <img src="./assets/images/big kitty2.png" alt="Motivational Image" />
        <h1>Opportunity</h1>
        <hr />
        <p>Sometimes, the right fit is the one you choose to believe in.</p>
      </div>
    </div>
  </body>
</html>
